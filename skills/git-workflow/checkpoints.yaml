# Checkpoints for git-workflow skill
# Focuses on git repository hygiene and workflow best practices

version: 1
skill_id: git-workflow

mechanical:
  # === GITIGNORE ===
  - id: GW-01
    type: file_exists
    target: .gitignore
    severity: error
    desc: ".gitignore must exist to prevent committing unwanted files"

  - id: GW-02
    type: contains
    target: .gitignore
    pattern: ".env"
    severity: warning
    desc: ".gitignore should exclude .env files"

  - id: GW-03
    type: contains
    target: .gitignore
    pattern: "vendor"
    severity: warning
    desc: ".gitignore should exclude vendor directory"

  - id: GW-04
    type: contains
    target: .gitignore
    pattern: "node_modules"
    severity: info
    desc: ".gitignore should exclude node_modules if using npm"

  # === PR TEMPLATE ===
  # GitHub resolves a PR template from the repository root, `.github/` or
  # `docs/`, in either spelling and in a single-file or a directory form —
  # and, when the repository provides none, from the OWNER's `.github`
  # repository, which serves one org-wide. Checking only the two repo-local
  # `.github/` file paths reported netresearch/git-workflow-skill as missing a
  # PR template while netresearch/.github/pull_request_template.md was serving
  # it to every repo in the org.
  #
  # A `file_exists` target cannot reach the second source. `org_provides:` can,
  # but takes a single path and returns *fail* — not skip — when gh is absent
  # or unauthenticated (run-checkpoints.sh, check_org_provides), which trades
  # one false failure for another. So the check is inlined as a script.
  #
  # Multi-line on purpose: the runner screens a block-scalar body with
  # is_safe_script_text (run-checkpoints.sh:895-916) and runs it from a temp
  # file. That path drops the whitelist and the `; && || $()` ban, both of
  # which describe the SINGLE-LINE analyzer (is_safe_eval_command). Same
  # vehicle as GH-31 in github-project, spelled `pattern:` rather than
  # `target:` so validate-checkpoints.sh accepts it.
  - id: GW-05
    type: command
    pattern: |
      # Repo-local first — all six single-file locations GitHub honours.
      for f in pull_request_template.md PULL_REQUEST_TEMPLATE.md \
               .github/pull_request_template.md .github/PULL_REQUEST_TEMPLATE.md \
               docs/pull_request_template.md docs/PULL_REQUEST_TEMPLATE.md; do
        test -f "$f" && exit 0
      done
      # ...then the DIRECTORY form, which holds several templates the author
      # picks between. This skill's own scripts/verify-git-workflow.sh and
      # scripts/repo-contribution-preflight.sh both accept it; a repo using it
      # has a working template and must not be reported as missing one.
      for d in .github/PULL_REQUEST_TEMPLATE PULL_REQUEST_TEMPLATE docs/PULL_REQUEST_TEMPLATE; do
        for t in "$d"/*; do
          test -f "$t" && exit 0
        done
      done
      # No local template: the org may still provide one. Without gh, without
      # auth, or on a non-github remote that half is unknowable — pass quietly
      # rather than report a template as missing on evidence we do not have.
      command -v gh >/dev/null 2>&1 || exit 0
      gh auth status >/dev/null 2>&1 || exit 0
      R=$(gh repo view --json nameWithOwner --jq .nameWithOwner 2>/dev/null) || exit 0
      test -n "$R" || exit 0
      O=${R%%/*}
      for f in pull_request_template.md PULL_REQUEST_TEMPLATE.md \
               .github/pull_request_template.md .github/PULL_REQUEST_TEMPLATE.md \
               docs/pull_request_template.md docs/PULL_REQUEST_TEMPLATE.md \
               .github/PULL_REQUEST_TEMPLATE PULL_REQUEST_TEMPLATE \
               docs/PULL_REQUEST_TEMPLATE; do
        gh api "repos/$O/.github/contents/$f" >/dev/null 2>&1 && exit 0
      done
      exit 1
    severity: warning
    desc: >-
      A PR template should exist — in this repository (root, .github/ or
      docs/, single file or PULL_REQUEST_TEMPLATE/ directory) or org-wide in
      OWNER/.github. Passes quietly when gh is unavailable or
      unauthenticated: the org half cannot be read there.

  # === CODEOWNERS ===
  # GitHub looks for CODEOWNERS in this order: .github/CODEOWNERS, root,
  # docs/CODEOWNERS. Either of the first two satisfies the requirement;
  # `.github/CODEOWNERS` is the Netresearch standard. The previous GW-07
  # ("root CODEOWNERS as fallback") was redundant info noise — collapsed
  # into GW-06's brace-target.
  - id: GW-06
    type: file_exists
    target: "{.github/CODEOWNERS,CODEOWNERS,docs/CODEOWNERS}"
    severity: warning
    desc: >-
      CODEOWNERS should exist for automatic review assignments.
      Netresearch standard: .github/CODEOWNERS (GitHub's primary lookup
      location). Root and docs/ are fallbacks per GitHub docs.

  # === BRANCH PROTECTION INDICATORS ===
  # A branch is protected by classic branch protection, by a RULESET, or by
  # both, and the classic endpoint is blind to rulesets. Reading it alone
  # reports a correctly protected branch as unprotected: on
  # netresearch/t3x-nr-temporal-cache `repos/…/branches/main/protection`
  # carries no `required_status_checks` key at all, while ruleset
  # `t3x-baseline` enforces eight contexts (All security checks, CodeQL, DCO,
  # Opengrep OSS, betterleaks, "ci / All CI checks", scorecard, zizmor). On a
  # repository governed by rulesets ALONE the classic endpoint 404s and the
  # gh_api type turned that into "GitHub API call failed" — a finding about
  # the reader, not the repository.
  #
  # So GW-08/09/10/11 read `repos/OWNER/REPO/rules/branches/BRANCH`, which
  # returns the EFFECTIVE rules, and pass when either source enforces the
  # requirement. GH-31 in github-project is the same dual-source shape.
  #
  # Two further defects go with it: the branch was hardcoded to `main` (404 on
  # a repo whose default is `master`/`develop`), and gh_api's "skip when gh is
  # missing" becomes a quiet pass here — a `command` checkpoint has no skip
  # status, and a pass on unreadable evidence beats a fabricated failure.
  #
  # Multi-line on purpose — see the note on GW-05 for why a block-scalar body
  # may use `$()` and `||` where a one-line pattern may not.
  - id: GW-08
    type: command
    pattern: |
      command -v gh >/dev/null 2>&1 || exit 0
      gh auth status >/dev/null 2>&1 || exit 0
      R=$(gh repo view --json nameWithOwner --jq .nameWithOwner 2>/dev/null) || exit 0
      B=$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name 2>/dev/null) || exit 0
      # A default branch may contain '/' (release/1.0); unencoded it splits the
      # REST path and both endpoints below answer for something else.
      B=$(printf %s "$B" | jq -sRr @uri)
      test -n "$R" || exit 0
      test -n "$B" || exit 0
      classic=$(gh api "repos/$R/branches/$B/protection" \
        --jq '((.required_status_checks.checks // .required_status_checks.contexts // []) | length) > 0' 2>/dev/null || echo false)
      ruleset=$(gh api "repos/$R/rules/branches/$B" \
        --jq 'any(.[]?; .type == "required_status_checks"
                        and ((.parameters.required_status_checks // []) | length) > 0)' 2>/dev/null || echo false)
      [ "$classic" = "true" ] || [ "$ruleset" = "true" ]
    severity: warning
    desc: >-
      Default branch should require status checks, enforced by classic branch
      protection or by a ruleset. Counts the contexts rather than the presence
      of the block: a protection object listing zero checks enforces nothing.

  - id: GW-09
    type: command
    pattern: |
      command -v gh >/dev/null 2>&1 || exit 0
      gh auth status >/dev/null 2>&1 || exit 0
      R=$(gh repo view --json nameWithOwner --jq .nameWithOwner 2>/dev/null) || exit 0
      B=$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name 2>/dev/null) || exit 0
      # A default branch may contain '/' (release/1.0); unencoded it splits the
      # REST path and both endpoints below answer for something else.
      B=$(printf %s "$B" | jq -sRr @uri)
      test -n "$R" || exit 0
      test -n "$B" || exit 0
      classic=$(gh api "repos/$R/branches/$B/protection" \
        --jq '.required_pull_request_reviews != null' 2>/dev/null || echo false)
      ruleset=$(gh api "repos/$R/rules/branches/$B" \
        --jq 'any(.[]?; .type == "pull_request")' 2>/dev/null || echo false)
      [ "$classic" = "true" ] || [ "$ruleset" = "true" ]
    severity: warning
    desc: >-
      Default branch should require a pull request before merging, enforced by
      classic branch protection or by a ruleset. Asks for the requirement's
      presence only — `required_approving_review_count: 0` still passes, as it
      did before; whether the count is high enough is GH-22's question.

  - id: GW-10
    type: command
    pattern: |
      command -v gh >/dev/null 2>&1 || exit 0
      gh auth status >/dev/null 2>&1 || exit 0
      R=$(gh repo view --json nameWithOwner --jq .nameWithOwner 2>/dev/null) || exit 0
      B=$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name 2>/dev/null) || exit 0
      # A default branch may contain '/' (release/1.0); unencoded it splits the
      # REST path and both endpoints below answer for something else.
      B=$(printf %s "$B" | jq -sRr @uri)
      test -n "$R" || exit 0
      test -n "$B" || exit 0
      # enforce_admins is a CLASSIC-protection field with no field-for-field
      # ruleset counterpart (a ruleset spells the same idea as an empty
      # bypass_actors list). So: no classic protection means not applicable,
      # not a finding — read the bypass_actors of the ruleset by hand.
      gh api "repos/$R/branches/$B/protection" >/dev/null 2>&1 || exit 0
      enforced=$(gh api "repos/$R/branches/$B/protection" \
        --jq '.enforce_admins.enabled // false' 2>/dev/null || echo false)
      [ "$enforced" = "true" ]
    severity: info
    desc: >-
      Classic branch protection may apply to admins too. Org default at
      Netresearch leaves this off so admins keep bypass for emergency
      response; tighten to true only if your policy requires admin
      enforcement. Says nothing about a ruleset-governed branch — read
      `gh api repos/OWNER/REPO/rulesets/ID --jq .bypass_actors` for that.

  # === SIGNED COMMITS REQUIREMENT ===
  - id: GW-11
    type: command
    pattern: |
      command -v gh >/dev/null 2>&1 || exit 0
      gh auth status >/dev/null 2>&1 || exit 0
      R=$(gh repo view --json nameWithOwner --jq .nameWithOwner 2>/dev/null) || exit 0
      B=$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name 2>/dev/null) || exit 0
      # A default branch may contain '/' (release/1.0); unencoded it splits the
      # REST path and both endpoints below answer for something else.
      B=$(printf %s "$B" | jq -sRr @uri)
      test -n "$R" || exit 0
      test -n "$B" || exit 0
      classic=$(gh api "repos/$R/branches/$B/protection" \
        --jq '.required_signatures.enabled // false' 2>/dev/null || echo false)
      ruleset=$(gh api "repos/$R/rules/branches/$B" \
        --jq 'any(.[]?; .type == "required_signatures")' 2>/dev/null || echo false)
      [ "$classic" = "true" ] || [ "$ruleset" = "true" ]
    severity: info
    desc: >-
      Default branch should require signed commits, enforced by classic branch
      protection or by a ruleset (`required_signatures` in both spellings).

  # === EDITORCONFIG ===
  - id: GW-12
    type: file_exists
    target: .editorconfig
    severity: info
    desc: ".editorconfig should exist for consistent formatting across editors"

  # === CONTRIBUTING GUIDE ===
  - id: GW-13
    type: file_exists
    target: CONTRIBUTING.md
    severity: info
    desc: "CONTRIBUTING.md should exist with workflow guidelines"

  # === GIT HOOKS ===
  # Accept all common git-hook framework locations including the Netresearch
  # standard `Build/captainhook.json` (configured via composer.json
  # extra.captainhook.config — the official captainhook/hook-installer
  # plugin pattern). Same brace target as TT-71 in typo3-testing-skill.
  - id: GW-14
    type: file_exists
    target: "{Build/captainhook.json,captainhook.json,.captainhook/captainhook.json,lefthook.yml,.lefthook.yml,.husky,.pre-commit-config.yaml}"
    severity: warning
    desc: >-
      A git hook framework config should exist. Netresearch standard for
      TYPO3 extensions: Build/captainhook.json (declared in composer.json
      extra.captainhook.config). Also accepts root captainhook.json,
      lefthook, husky, pre-commit.

  - id: GW-14a
    type: contains
    target: composer.json
    pattern: "captainhook/hook-installer"
    severity: info
    desc: >-
      If captainhook/hook-installer is in composer.json, document the
      git-worktree workaround (composer install --no-plugins) in README —
      see references/git-hooks-setup.md 'CaptainHook + git worktrees'

  # === UNRELEASED COMMITS ===
  # GW-15 was removed rather than fixed: counting commits since the last tag
  # needs a rev-range (`<tag>..HEAD`) and command substitution, and the runner's
  # SINGLE-LINE allowlist rejects both — `..` as path traversal, `$(` as command
  # chaining. It never ran. (A block-scalar body is screened by
  # is_safe_script_text instead, which permits both — GW-08 uses that vehicle —
  # so restoring GW-15 is now possible; it has not been done.) The rule itself
  # is intact and lives where a full shell is available, in
  # scripts/verify-git-workflow.sh ("Unreleased Commits").

  # === INTERMEDIATE PLANNING ARTIFACTS ===
  # `! … | grep -q .` rather than `test -z "$(…)"`: same verdict, no command
  # substitution. The runner strips a leading `!` before checking the base
  # command, so the negated pipeline is allowlist-conform.
  - id: GW-16
    type: command
    pattern: '! git ls-files -- docs/superpowers/ claudedocs/ docs/working/ | grep -q .'
    severity: warning
    desc: >-
      Intermediate planning artifacts (superpowers specs/plans, claudedocs,
      working notes) should not be tracked on the base branch — convert durable
      decisions to an ADR and remove the raw files. See
      references/spec-cleanup.md and spec-cleanup-guard.sh.

  # Signature *presence*, read from the commit object. Deliberately not `%G?`
  # or `--show-signature`: under gpg.format=ssh with no
  # gpg.ssh.allowedSignersFile both report a correctly signed commit as
  # unsigned, which fails a fully signed repository. Whether a signature
  # verifies is the host's answer (GW-11 / the commits API), not this one's.
  # Kept in step with signing-preflight.sh by tests/test_signing_preflight.sh.
  #
  # HEAD only, single line, and no `$(`/`;`/`&&`: for a one-line pattern the
  # checkpoint runner's allowlist (is_safe_eval_command in
  # automated-assessment's run-checkpoints.sh) rejects command-chaining
  # metacharacters outright. A loop over the last five commits does not fit
  # that, so this mirrors the rule rather than reproducing it — the same
  # arrangement as SR-37 in skill-repo. The full sweep lives in
  # verify-git-workflow.sh (last 10) and signing-preflight.sh.
  # `sed -n -e '/^$/q' -e p` is the semicolon-free spelling of the header cut.
  - id: GW-17
    type: command
    pattern: "git cat-file commit HEAD | sed -n -e '/^$/q' -e p | grep -qE '^gpgsig(-sha256)? '"
    severity: info
    desc: "HEAD should carry a GPG/SSH signature"

llm_reviews:
  # === CONVENTIONAL COMMITS ===
  - id: GW-20
    domain: git-workflow
    prompt: |
      Analyze the recent commit history (last 20 commits) for conventional commit format usage.

      Conventional commits follow the pattern: <type>(<scope>): <description>
      Types include: feat, fix, docs, style, refactor, perf, test, chore, ci, build

      Check:
      1. What percentage of commits follow conventional commit format?
      2. Are commit messages descriptive (not just "fix", "update", etc.)?
      3. Are there any empty or single-word commit messages?

      Use `git log --oneline -20` to analyze.

      Report:
      - Pass if >80% follow conventional format
      - Warn if 50-80% follow format
      - Fail if <50% follow format
    severity: warning
    desc: "Recent commits should follow conventional commit format"

  # mechanical-counterpart: GW-17
  - id: GW-21
    domain: git-workflow
    prompt: |
      Check whether the repository's commits carry signatures. This checkpoint
      asks about signature *presence*, not about whether the signatures verify —
      that is the host's answer, not the local keyring's.

      Read the commit object — a signed commit carries a `gpgsig` header:

      ```
      git log -5 --format=%H | while read -r c; do
        git cat-file commit "$c" | sed -n '/^$/q;p' | grep -qE '^gpgsig(-sha256)? ' \
          && echo "$c signed" || echo "$c UNSIGNED"
      done
      ```

      Do NOT use `git log --show-signature` or `%G?` here: under `gpg.format=ssh`
      with no `gpg.ssh.allowedSignersFile` they report `No signature` / `N` on
      correctly signed commits, which fails a fully signed repository.

      Report:
      - How many of the last 5 commits are signed?
      - Are all commits from the same author signed?
      - Pass if all commits are signed, warn if some, fail if none
    severity: info
    desc: "Commits should carry a GPG/SSH signature"

  - id: GW-22
    domain: git-workflow
    prompt: |
      Analyze commit message quality in the last 10 commits.

      Good commit messages:
      - Start with a verb in imperative mood (Add, Fix, Update, etc.)
      - Are 50-72 characters for the subject line
      - Explain "why" not just "what"
      - Reference issues when applicable (Fixes #123, Closes #456)

      Use `git log --format="%s" -10` to get subject lines.

      Report on overall quality and specific improvements needed.
    severity: info
    desc: "Commit messages should be clear and follow best practices"

  - id: GW-23
    domain: git-workflow
    prompt: |
      Review the CODEOWNERS file if it exists.

      Check:
      1. Does it cover critical paths (src/, .github/, etc.)?
      2. Are the owners valid GitHub usernames or teams?
      3. Is the syntax correct (path followed by @owner)?
      4. Are there any overly broad patterns like "* @owner"?

      Report issues or confirm proper setup.
    severity: warning
    desc: "CODEOWNERS should properly cover critical code paths"

  - id: GW-24
    domain: git-workflow
    prompt: |
      Review the PR template if it exists — in any location GW-05 accepts
      (root, .github/ or docs/, either spelling, single file or
      PULL_REQUEST_TEMPLATE/ directory), or org-wide in OWNER/.github.

      A good PR template should include:
      - Description/Summary section
      - Type of change (feature, fix, breaking, etc.)
      - Testing checklist
      - Related issues/tickets
      - Review guidelines or checklist

      Report on completeness and suggest improvements.
    severity: info
    desc: "PR template should guide contributors effectively"

  - id: GW-25
    domain: git-workflow
    prompt: |
      Check if the repository has git hooks configured with a hook framework
      (lefthook, captainhook, husky, or pre-commit).

      Look for config files: lefthook.yml, .lefthook.yml, captainhook.json,
      .husky/ directory, .pre-commit-config.yaml.

      If hooks are configured, verify they cover at minimum:
      1. pre-commit stage (formatting, linting, or validation)
      2. commit-msg stage (message format validation)

      Report:
      - Pass if both pre-commit and commit-msg hooks are configured
      - Warn if only one stage is covered
      - Fail if no hook framework is found
    severity: warning
    desc: "Git hooks should cover pre-commit and commit-msg stages at minimum"

  # === RELEASE HYGIENE ===
  - id: GW-26
    domain: release
    severity: warning
    desc: "Feature and fix commits on main should be released promptly"
    prompt: |
      Audit unreleased commits on main:
      1. Run `git describe --tags --abbrev=0 2>/dev/null` to find latest tag.
         If git describe fails (no tags), the check passes — skip remaining steps.
      2. Run `git log <tag>..HEAD --oneline` to see unreleased commits
      3. How many days since the last tag? (use `git log -1 --format=%ci <tag>`)
      4. Do unreleased commits contain feat: or fix: types?
      5. Flag as warning if feat/fix unreleased >7 days, error if >30 days

  - id: GW-27
    domain: release
    severity: warning
    desc: "GitHub releases should have non-duplicated content and meaningful descriptions"
    prompt: |
      Audit the 3 most recent GitHub releases:
      1. Run `gh release list --limit 3 --json body` to fetch release bodies in one call
      2. Check for DUPLICATE CONTENT (body repeated twice - common with generate_release_notes + body)
      3. Check QUALITY: narrative summary vs just auto-generated lists
      4. Flag duplicate content as error, missing narrative as info

  - id: GW-28
    domain: release
    severity: warning
    desc: "Release workflows should include workflow_dispatch for manual re-triggering"
    prompt: |
      Scan all workflow files in .github/workflows/.
      Identify release workflows by filename (release, publish) or content (gh release create, semantic-release).
      For each, check for workflow_dispatch trigger.
      Flag missing workflow_dispatch as warning.

  # === BARE-WORKTREE LAYOUT ===
  - id: GW-29
    domain: git-workflow
    severity: warning
    desc: "Bare-worktree layout: never switch branches in an existing worktree — use `git worktree add`"
    prompt: |
      Detect bare-worktree layout: a `.bare/` directory at the repo root
      AND at least one sibling worktree directory (e.g. `main/`, `feat-*/`).
      Standard discovery: `ls -d .bare/ 2>/dev/null && git -C .bare worktree list`.

      If the layout is in use, verify the working pattern:
      1. Recent reflog of any worktree should NOT show in-place branch switch
         events such as `checkout: moving from <a> to <b>` or
         `switch: moving from <a> to <b>` (these are recorded by `git checkout`
         and `git switch`, including the `-b`/`-c` create-and-switch variants).
      2. New branches should appear as new worktree directories, registered via
         `git worktree add <path> -b <branch>`.

      Use `git reflog show HEAD -n 50` inside each worktree to inspect entries.
      Note: the reflog records the resulting move, not the CLI flags — so
      `checkout -b feat/x` and `switch feat/x` both surface as
      `checkout:`/`switch: moving from … to …` lines.

      Pass when no in-place branch switching is found in the last ~50 reflog
      entries across worktrees. Warn when in-place switch events exist —
      they violate the convention and produce branches that are confusing to
      reason about (working tree vs branch tip diverge for the original
      worktree's intended branch).

      Skip cleanly (pass) when the repo is a regular clone (`.git/` is a
      directory, no `.bare/` sibling) — the convention does not apply.

  # === STAGING BRANCH COMPOSER.LOCK MERGE STRATEGY ===
  # mechanical-counterpart: none (the commands gather the staging lockfile; the
  # judgement — which merge strategy applies — is the checkpoint)
  - id: GW-30
    domain: git-workflow
    severity: warning
    desc: >-
      When merging into a staging branch that pins dev-branch Composer packages,
      take --ours on composer.lock then re-run `composer update <packages>` to
      apply only the intended upgrades. Taking --theirs overwrites staging's
      dev-* pins and may deploy wrong package versions.
    prompt: |
      Check if the repository has a `staging` branch and a `composer.lock`
      containing `dev-` versioned packages (e.g. `dev-staging`, `dev-main`).

      Run:
        git fetch origin staging:refs/remotes/origin/staging --depth=1 2>/dev/null || true
        (git show origin/staging:composer.lock || git show staging:composer.lock) 2>/dev/null | grep '"version": "dev-' | head -5

      If dev-versioned packages exist, verify that the project's contributing
      guide or AGENTS.md documents the staging merge strategy:
      - On merge conflict in composer.lock: take `--ours` (staging base) first
      - Then run `composer update <targeted-packages>` to apply only the
        intended version changes
      - Do NOT take `--theirs` — it overwrites all dev-* pins

      Report as warning if dev-* packages exist but the strategy is not documented.
